<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemiii AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col justify-between">
    <header class="bg-gray-800 p-4 shadow-md flex flex-col md:flex-row justify-between items-center gap-4 border-b border-gray-700">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold text-blue-400">Gemiii AI Assistant</h1>
            <span class="text-xs text-green-400 bg-green-900 px-2.5 py-1 rounded-full font-semibold">Secure &amp; Ready</span>
        </div>
        <div class="flex items-center gap-2 bg-gray-900 p-1.5 rounded-lg border border-gray-700 w-full md:w-auto">
            <input type="password" id="apiKey" placeholder="Gemini API key yahan likhein" class="bg-transparent px-3 py-1 text-sm outline-none text-white placeholder-gray-400 w-64">
            <button onclick="saveApiKey()" class="bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded text-xs font-semibold transition">Save</button>
        </div>
    </header>

    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex justify-start">
            <div class="bg-gray-800 p-3 rounded-lg max-w-[80%] text-sm shadow">
                Hello! Main aapka personal AI assistant <b>Gemiii</b> hoon. Upar apni Gemini API key save karke mujhse kuch bhi poochein, scripts banwayein ya tasks plan karein!
            </div>
        </div>
    </main>

    <footer class="bg-gray-800 p-4 shadow-inner">
        <div class="max-w-3xl mx-auto flex items-center gap-2">
            <label class="bg-gray-700 hover:bg-gray-600 p-2.5 rounded-lg cursor-pointer flex items-center justify-center transition" title="Upload File/Image">
                <input type="file" id="fileInput" class="hidden" onchange="handleFileSelect(event)">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                </svg>
            </label>
            <span id="fileIndicator" class="text-xs text-green-400 hidden truncate max-w-[120px]"></span>
            <input type="text" id="userInput" placeholder="Ask Gemiii..." class="flex-1 bg-gray-700 px-4 py-2.5 rounded-lg outline-none border border-gray-600 focus:border-blue-400 text-sm text-white placeholder-gray-400">
            <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-500 px-5 py-2.5 rounded-lg font-semibold text-sm transition">Send</button>
        </div>
    </footer>

    <script>
        let selectedFileBase64 = null;
        let selectedFileMimeType = null;

        function saveApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            // Supports current Google Gemini authorization keys as well as standard keys.
            if (key.length > 20) {
                localStorage.setItem('gemini_api_key', key);
                alert('API Key successfully save ho gayi hai!');
            } else {
                alert('Ghalat key! Apni Google Gemini API key dobara check karein.');
            }
        }

        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) document.getElementById('apiKey').value = savedKey;
        };

        function handleFileSelect(event) {
            const file = event.target.files[0];
            const indicator = document.getElementById('fileIndicator');
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                selectedFileMimeType = file.type || 'application/octet-stream';
                selectedFileBase64 = e.target.result.split(',')[1];
                indicator.textContent = file.name;
                indicator.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        async function sendMessage() {
            const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKey').value.trim();
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            const chatContainer = document.getElementById('chatContainer');

            if (!apiKey || apiKey.length <= 20) {
                alert('Pehle apni Google Gemini API key enter karke Save dabayein!');
                return;
            }
            if (!messageText && !selectedFileBase64) return;

            let userDisplayHtml = '<div class="flex justify-end"><div class="bg-blue-600 p-3 rounded-lg max-w-[80%] text-sm shadow">';
            if (selectedFileBase64) userDisplayHtml += '<p class="italic text-xs text-blue-200 mb-1">[Attached File]</p>';
            if (messageText) userDisplayHtml += `<span>${escapeHtml(messageText)}</span>`;
            userDisplayHtml += '</div></div>';
            chatContainer.innerHTML += userDisplayHtml;

            const currentText = messageText || 'Please analyze this file.';
            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatContainer.innerHTML += `
                <div id="${loadingId}" class="flex justify-start">
                    <div class="bg-gray-800 p-3 rounded-lg max-w-[80%] text-sm text-gray-400 italic shadow">Gemiii is thinking...</div>
                </div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const parts = [];
            if (selectedFileBase64) {
                parts.push({ inlineData: { mimeType: selectedFileMimeType, data: selectedFileBase64 } });
            }
            parts.push({ text: currentText });

            const requestBody = {
                system_instruction: {
                    parts: [{ text: 'You are Gemiii, an advanced, friendly, and intelligent AI personal assistant powered by Gemini, similar to Siri. Your primary role is to engage in natural, smooth, and helpful conversations with the user, help organize and split content creation tasks, write scripts, and maintain a professional yet warm and engaging tone.' }]
                },
                contents: [{ role: 'user', parts }]
            };

            selectedFileBase64 = null;
            selectedFileMimeType = null;
            document.getElementById('fileIndicator').classList.add('hidden');
            document.getElementById('fileInput').value = '';

            // Keep the API key out of source code. The key is read from the Settings box/localStorage.
            const model = 'gemini-3.8-flash';
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 30000);

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody),
                    signal: controller.signal
                });
                clearTimeout(timeout);

                const data = await response.json();
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();

                if (response.ok && data.candidates?.[0]?.content?.parts?.[0]?.text) {
                    const aiReply = data.candidates[0].content.parts.map(p => p.text || '').join('');
                    chatContainer.innerHTML += `
                        <div class="flex justify-start">
                            <div class="bg-gray-800 p-3 rounded-lg max-w-[80%] text-sm shadow whitespace-pre-wrap">${escapeHtml(aiReply)}</div>
                        </div>`;
                } else {
                    const errorMsg = data.error?.message || 'Invalid API response.';
                    chatContainer.innerHTML += `
                        <div class="flex justify-start">
                            <div class="bg-red-900 p-3 rounded-lg max-w-[80%] text-sm shadow">Error: ${escapeHtml(errorMsg)}</div>
                        </div>`;
                }
            } catch (error) {
                clearTimeout(timeout);
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();
                const message = error.name === 'AbortError'
                    ? 'Gemini ne 30 seconds mein response nahi diya. Model/key/project check karein.'
                    : 'Network Error: Kuch masla ho gaya hai.';
                chatContainer.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-red-900 p-3 rounded-lg max-w-[80%] text-sm shadow">${escapeHtml(message)}</div>
                    </div>`;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
